<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2064" height="2752" viewBox="0 0 2064 2752">
  <!--
    The App Store image for iPad, the 13-inch display (iPad Pro 13-inch, M4), 2064 x 2752.
    scripts/compose-store-images.ts fills it in for each entry in a locale's
    captions.json, then lays it out:
      #title, #subtitle   the caption, wrapped to data-width, at most data-max-lines,
                          shrunk to fit; stacked from the top of #panel with data-gap
      #chips              one pill per chip, the template's #chip copied and centred
      #panel              grows to hold them, data-padding round them
      #device             scaled to fit below the panel, data-gap under it and
                          data-margin above the bottom; data-width and data-height
                          are its size before scaling
      #screen             the raw capture, clipped to the display
    Colours are CSS variables the composer sets from card-colours.json, with
    fallbacks so the template opens in any SVG editor as it will look.
  -->
  <style>
    svg { --top: #2F6FD0; --bottom: #1B4E9E; --card-ink: #FFFFFF; --panel: #FFFFFF; --ink: #1C1C1E; --secondary-ink: rgba(28, 28, 30, 0.7); --accent: #D0185B; }
    text { font-family: system-ui, -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--top)"/>
      <stop offset="1" style="stop-color: var(--bottom)"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4D53"/>
      <stop offset="0.45" stop-color="#26282C"/>
      <stop offset="1" stop-color="#3C3F44"/>
    </linearGradient>
    <clipPath id="display"><path d="M154 94H2098A60 60 0 0 1 2158 154V2786A60 60 0 0 1 2098 2846H154A60 60 0 0 1 94 2786V154A60 60 0 0 1 154 94Z"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="59" stdDeviation="74" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect id="background-fill" width="2064" height="2752" fill="url(#background)"/>

  <rect id="panel" x="84" y="92" width="1896" height="380" rx="72" style="fill: var(--panel)" data-padding="84"/>
  <text id="title" x="1032" y="190" text-anchor="middle" font-size="128" font-weight="700" letter-spacing="-1"
        style="fill: var(--ink)" data-width="1700" data-max-lines="2" data-line-height="1.08">The card for where you are</text>
  <text id="subtitle" x="1032" y="300" text-anchor="middle" font-size="68" font-weight="500"
        style="fill: var(--secondary-ink)" data-width="1700" data-max-lines="2" data-line-height="1.22" data-gap="34">It's first in the list when you're there</text>
  <g id="chips" data-gap="29" data-spacing="21" data-height="109">
    <g id="chip">
      <rect height="109" rx="54.5" style="fill: var(--accent)"/>
      <text font-size="52" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-padding="52">No account</text>
    </g>
  </g>

  <g id="device" data-width="2252" data-height="2940" data-gap="84" data-margin="84" filter="url(#shadow)">
    <path d="M154 0H2098A154 154 0 0 1 2252 154V2786A154 154 0 0 1 2098 2940H154A154 154 0 0 1 0 2786V154A154 154 0 0 1 154 0Z" fill="url(#metal)"/>
    <path d="M154 0H2098A154 154 0 0 1 2252 154V2786A154 154 0 0 1 2098 2940H154A154 154 0 0 1 0 2786V154A154 154 0 0 1 154 0Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
    <rect x="2248" y="160" width="12" height="180" rx="6" fill="#2E3035"/>
    <rect x="2248" y="380" width="12" height="180" rx="6" fill="#2E3035"/>
    <path d="M154 14H2098A140 140 0 0 1 2238 154V2786A140 140 0 0 1 2098 2926H154A140 140 0 0 1 14 2786V154A140 140 0 0 1 154 14Z" fill="#050506"/>
    <circle cx="2198" cy="1470" r="11.428571428571429" fill="#1A1C20"/>
    <image id="screen" x="94" y="94" width="2064" height="2752" preserveAspectRatio="xMidYMid slice" clip-path="url(#display)" xlink:href="" href=""/>
  </g>
</svg>
