<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1398" height="2034" viewBox="0 0 1398 2034">
  <!--
    The App Store image for iPhone Duo, 1398 x 2034, its outer display.
    scripts/compose-store-images.ts fills it in for each entry in a locale's
    captions.json, then lays it out:
      #title, #subtitle   the caption, wrapped to data-width, at most data-max-lines,
                          shrunk to fit; stacked from the top of #panel with data-gap
      #chips              one pill per chip, the template's #chip copied and centred
      #panel              grows to hold them, data-padding round them
      #device             scaled to fit below the panel, data-gap under it and
                          data-margin above the bottom; data-width and data-height
                          are its size before scaling
      #screen             the raw capture, clipped to the display
    Colours are CSS variables the composer sets from card-colours.json, with
    fallbacks so the template opens in any SVG editor as it will look.
  -->
  <style>
    svg { --top: #2F6FD0; --bottom: #1B4E9E; --card-ink: #FFFFFF; --panel: #FFFFFF; --ink: #1C1C1E; --secondary-ink: rgba(28, 28, 30, 0.7); --accent: #D0185B; }
    text { font-family: system-ui, -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--top)"/>
      <stop offset="1" style="stop-color: var(--bottom)"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4D53"/>
      <stop offset="0.45" stop-color="#26282C"/>
      <stop offset="1" stop-color="#3C3F44"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141518"/>
      <stop offset="0.35" stop-color="#5A5E65"/>
      <stop offset="0.6" stop-color="#2C2E33"/>
      <stop offset="1" stop-color="#17181B"/>
    </linearGradient>
    <clipPath id="display"><path d="M102 34H1299A177 177 0 0 1 1476 211V1891A177 177 0 0 1 1299 2068H102A24 24 0 0 1 78 2044V58A24 24 0 0 1 102 34Z"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="40" stdDeviation="50" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect id="background-fill" width="1398" height="2034" fill="url(#background)"/>
  <rect id="panel" x="56" y="64" width="1286" height="380" rx="56" style="fill: var(--panel)" data-padding="64"/>
  <text id="title" x="699" y="190" text-anchor="middle" font-size="96" font-weight="700" letter-spacing="-1"
        style="fill: var(--ink)" data-width="1160" data-max-lines="2" data-line-height="1.08">The card for where you are</text>
  <text id="subtitle" x="699" y="300" text-anchor="middle" font-size="52" font-weight="500"
        style="fill: var(--secondary-ink)" data-width="1160" data-max-lines="2" data-line-height="1.22" data-gap="26">It's first in the list when you're there</text>
  <g id="chips" data-gap="22" data-spacing="16" data-height="84">
    <g id="chip">
      <rect height="84" rx="42" style="fill: var(--accent)"/>
      <text font-size="40" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-padding="40">No account</text>
    </g>
  </g>

  <g id="device" data-width="1510" data-height="2102" data-gap="64" data-margin="56" filter="url(#shadow)">
    <rect x="0" y="44" width="62" height="2014" rx="22" fill="url(#spine)"/>
    <path d="M102 0H1299A211 211 0 0 1 1510 211V1891A211 211 0 0 1 1299 2102H102A58 58 0 0 1 44 2044V58A58 58 0 0 1 102 0Z" fill="url(#metal)"/>
    <path d="M102 0H1299A211 211 0 0 1 1510 211V1891A211 211 0 0 1 1299 2102H102A58 58 0 0 1 44 2044V58A58 58 0 0 1 102 0Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
    <rect x="1506" y="420" width="12" height="230" rx="6" fill="#2E3035"/>
    <path d="M102 14H1299A197 197 0 0 1 1496 211V1891A197 197 0 0 1 1299 2088H102A44 44 0 0 1 58 2044V58A44 44 0 0 1 102 14Z" fill="#050506"/>
    <image id="screen" x="78" y="34" width="1398" height="2034" preserveAspectRatio="xMidYMid slice" clip-path="url(#display)" xlink:href="" href=""/>
  </g>
</svg>
