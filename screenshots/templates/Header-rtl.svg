<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="1646" viewBox="0 0 3840 1646">
  <!--
    The product page header, 3840 x 1646 (21:9): the card for where you are, among the others, mirrored for right-to-left languages.
    Apple's art safe area, from its creative asset template, is the box
    1097,493 1646 x 661 (#safe-area, never drawn): the title and the
    app's own screen stay inside it; the cards round it may be cropped or covered.
    scripts/compose-store-images.ts fills in #title from the locale's
    creative-asset.json ("header"), wrapped to data-width and centred on
    data-middle, and every image with data-capture from that capture.
  -->
  <style>
    svg { --top: #2F6FD0; --bottom: #1B4E9E; --card-ink: #FFFFFF; --panel: #FFFFFF; --ink: #1C1C1E; --secondary-ink: rgba(28, 28, 30, 0.7); --accent: #D0185B; }
    text { font-family: system-ui, -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--top)"/>
      <stop offset="1" style="stop-color: var(--bottom)"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4D53"/>
      <stop offset="0.45" stop-color="#26282C"/>
      <stop offset="1" stop-color="#3C3F44"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141518"/>
      <stop offset="0.35" stop-color="#5A5E65"/>
      <stop offset="0.6" stop-color="#2C2E33"/>
      <stop offset="1" stop-color="#17181B"/>
    </linearGradient>
    <clipPath id="display"><path d="M102 34H1299A177 177 0 0 1 1476 211V1891A177 177 0 0 1 1299 2068H102A24 24 0 0 1 78 2044V58A24 24 0 0 1 102 34Z"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="40" stdDeviation="50" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="3840" height="1646" fill="url(#background)"/>
  <rect id="safe-area" x="1097" y="493" width="1646" height="661" fill="none" visibility="hidden"/>
  <g transform="translate(2829.1 170) rotate(8 225.45000000000002 167.4)" filter="url(#card-shadow)">
