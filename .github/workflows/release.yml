name: Release to App Store

# A v* tag builds and uploads the app, then submits the version for App Store
# review with the tag's annotation as en-GB's What's New and each other
# localisation's from metadata/<locale>/release_notes.txt. A manual run builds
# and uploads but submits nothing. scripts/release-version.ts does the work.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    # The Xcode 27 image, so the App Store build uses the same Xcode as local builds (.xcode-version).
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # Assigned first so that a missing Xcode fails the step: inside echo's
    # arguments the failure would be lost.
    - name: Select the Xcode in .xcode-version
      run: |
        developer_dir="$(node scripts/select-xcode.ts)"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        "$developer_dir/usr/bin/xcodebuild" -version

    - name: Install signing
      uses: ./.github/actions/install-signing
      with:
        certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.P12_PASSWORD }}
        keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
        asc-key-id: ${{ secrets.ASC_KEY_ID }}
        asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
        asc-key-content: ${{ secrets.ASC_KEY_CONTENT }}

    # Stamps a build number, builds and uploads, and on a tag also attaches the
    # build to the version, sets What's New (en-GB's from the tag, the others'
    # from metadata/) and submits for review.
    - name: Release
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        # Only a pushed v* tag is released for review; empty on a manual run.
        RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      run: node scripts/release-version.ts

    - name: Remove the keychain
      if: ${{ always() }}
      run: node scripts/install-signing-certificate.ts --remove
