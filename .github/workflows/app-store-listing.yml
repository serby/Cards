name: App Store listing

# Pushes the App Store listing of the editable App Store version from the repo:
# the text in metadata/ (scripts/upload-metadata.ts) and the images in
# screenshots/store/ (scripts/upload-screenshots.ts). With "prepare version" it
# first numbers the version and attaches the newest processed build of that
# number (scripts/asc-version.ts). Run it by hand from the Actions tab, or:
#
#   gh workflow run app-store-listing.yml -f version=1.3 -f prepare-version=true
#
# Tick "dry run" to see every change without writing anything.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, such as 1.3 (default: the one being prepared)"
        type: string
        required: false
      prepare-version:
        description: "Prepare the version first: give it its number, creating it if needed (needs a version). The release workflow attaches the build"
        type: boolean
        default: false
      metadata:
        description: "Upload the text in metadata/"
        type: boolean
        default: true
      screenshots:
        description: "Upload the images in screenshots/store/"
        type: boolean
        default: true
      dry-run:
        description: "Only report what would change"
        type: boolean
        default: false

permissions:
  contents: read

# Two runs editing the same version at once would undo each other's work.
concurrency:
  group: app-store-listing
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    # Apple can take a quarter of an hour to process a screenshot on a slow day.
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      PREPARE_VERSION: ${{ inputs.prepare-version }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Check inputs
      run: |
        if [[ "$PREPARE_VERSION" == "true" && -z "$VERSION" ]]; then
          echo "::error::Preparing the version needs a version number, such as 1.3."
          exit 1
        fi

    - name: Prepare the version
      if: ${{ inputs.prepare-version }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: |
        args=(--version "$VERSION")
        if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
        node scripts/asc-version.ts "${args[@]}"

    # Before the screenshots, because it creates any localisation the version
    # lacks, and screenshots can only go into an existing one.
    - name: Upload metadata
      if: ${{ inputs.metadata }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: |
        args=()
        # A dry run of "prepare version" renumbers nothing, so pick the version
        # by its number only when it already has it.
        if [[ -n "$VERSION" && ! ( "$DRY_RUN" == "true" && "$PREPARE_VERSION" == "true" ) ]]; then args+=(--version "$VERSION"); fi
        if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
        node scripts/upload-metadata.ts "${args[@]}"

    - name: Upload screenshots
      if: ${{ inputs.screenshots }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: |
        args=()
        if [[ -n "$VERSION" && ! ( "$DRY_RUN" == "true" && "$PREPARE_VERSION" == "true" ) ]]; then args+=(--version "$VERSION"); fi
        if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
        node scripts/upload-screenshots.ts "${args[@]}"
