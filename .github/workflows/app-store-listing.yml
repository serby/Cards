name: App Store listing

# Pushes the App Store listing of the editable App Store version from the repo:
# the text in metadata/ (scripts/upload-metadata.ts), the images in
# screenshots/store/ (scripts/upload-screenshots.ts) and each locale's universal
# creative asset, the product page header and search results image
# (scripts/upload-creative-assets.ts). With "prepare version" it
# first numbers the version and attaches the newest processed build of that
# number (scripts/prepare-app-store-version.ts). Run it by hand from the
# Actions tab, or:
#
#   gh workflow run app-store-listing.yml -f version=1.3 -f prepare-version=true
#
# Tick "dry run" to see every change without writing anything.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, such as 1.3 (default: the one being prepared)"
        type: string
        required: false
      prepare-version:
        description: "Prepare the version first: give it its number, creating it if needed (needs a version). The release workflow attaches the build"
        type: boolean
        default: false
      metadata:
        description: "Upload the text in metadata/"
        type: boolean
        default: true
      screenshots:
        description: "Upload the images in screenshots/store/"
        type: boolean
        default: true
      creative-assets:
        description: "Upload and place the creative asset each creative-asset.json names"
        type: boolean
        default: true
      dry-run:
        description: "Only report what would change"
        type: boolean
        default: false

permissions:
  contents: read

# Two runs editing the same version at once would undo each other's work.
concurrency:
  group: app-store-listing
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-26.04
    # Apple can take a quarter of an hour to process a screenshot on a slow day.
    timeout-minutes: 120
    # The steps pass the version as "$VERSION", never as ${{ inputs.version }},
    # so the shell reads it as a value and never runs it as part of the script.
    env:
      VERSION: ${{ inputs.version }}
    steps:
    - name: Check inputs
      if: ${{ inputs.prepare-version && inputs.version == '' }}
      run: echo "::error::Preparing the version needs a version number, such as 1.3."; exit 1

    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Prepare the App Store version
      if: ${{ inputs.prepare-version }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: node scripts/prepare-app-store-version.ts --version "$VERSION" ${{ inputs.dry-run && '--dry-run' || '' }}

    # Before the screenshots, because it creates any localisation the version
    # lacks, and screenshots can only go into an existing one. A dry run of
    # "prepare version" renumbers nothing, so both uploads pick the version by
    # its number only when it already has it.
    - name: Upload metadata
      if: ${{ inputs.metadata }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: node scripts/upload-metadata.ts ${{ inputs.version != '' && !(inputs.dry-run && inputs.prepare-version) && '--version "$VERSION"' || '' }} ${{ inputs.dry-run && '--dry-run' || '' }}

    - name: Upload screenshots
      if: ${{ inputs.screenshots }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: node scripts/upload-screenshots.ts ${{ inputs.version != '' && !(inputs.dry-run && inputs.prepare-version) && '--version "$VERSION"' || '' }} ${{ inputs.dry-run && '--dry-run' || '' }}

    # Last, so a problem with the newer asset library leaves the rest done.
    - name: Upload creative assets
      if: ${{ inputs.creative-assets }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: node scripts/upload-creative-assets.ts ${{ inputs.version != '' && !(inputs.dry-run && inputs.prepare-version) && '--version "$VERSION"' || '' }} ${{ inputs.dry-run && '--dry-run' || '' }}
