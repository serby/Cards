name: Deploy Website

# The site is built from the app's own sources (scripts/lib/website.ts lists
# them), so a change to any of them redeploys it (spec/deployment.md, DEPLOY-5).
# Changes to the scripts do not; scripts.yml tests those. It deploys nothing while an
# App Store image is missing, and the build stops if a source is broken.

on:
  push:
    branches:
      - main
    paths:
      - 'Website/**'
      - 'metadata/**'
      - 'changelog.json'
      - 'screenshots/store/**'
      - 'Cards/Localizable.xcstrings'
      - 'Cards/UI/Theme/Colors.swift'
      - 'Cards.xcodeproj/project.pbxproj'
      - 'Cards.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# One deploy at a time, in the order of the pushes, so an older site never
# replaces a newer one.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # The site shows the iPhone Duo's App Store images, which are composed when a
    # version is ready to ship. Until the British English page's are all there it
    # says so and deploys nothing, rather than failing every push in between.
    # Another language's page leaves its images out until they are composed.
    - name: Check the British English page's App Store images are present
      id: images
      continue-on-error: true
      run: node scripts/build-website.ts --check-images

    - name: Build the website
      if: ${{ steps.images.outcome == 'success' }}
      run: node scripts/build-website.ts --allow-missing-images

    - name: Say why nothing was deployed
      if: ${{ steps.images.outcome != 'success' }}
      run: |
        echo "::notice::Not deployed, as some App Store images are missing (see the step above). The site deploys once they are committed."

    - name: Deploy to Cloudflare Pages
      if: ${{ steps.images.outcome == 'success' }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: node scripts/deploy-website.ts
