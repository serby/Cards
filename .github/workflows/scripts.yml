name: Scripts

# Tests the TypeScript scripts in scripts/, which build, test, release and
# publish the app, whenever they change (spec/deployment.md, DEPLOY-2). Only
# changes to the scripts trigger it, and changes to the scripts trigger no
# other workflow.

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'

# A newer push makes an older run's result moot.
concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Test the scripts
      run: node --test scripts/*.test.ts
