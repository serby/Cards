name: CI

# Every push and pull request: the validations, the release check and every
# test run. The tests run where scripts/lib/test-devices.ts says, the same
# list `make test-all` uses: the unit tests on the iPhone 17 on iOS 27.0, and
# the UI tests on the iPhone 17 on iOS 26.5, the iPhone 16 on iOS 18.6 and the
# iPad mini on iOS 26.5, each in its own job. The App Store images are checked
# by release.yml, which uploads them, not here.

on:
  push:
  pull_request:

# A newer push makes an older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # The App Store listing text in metadata/ must fit App Store Connect's limits.
    - name: Check App Store metadata
      run: node scripts/check-metadata.ts

    # changelog.json must be valid, start with the app's version, and match the
    # files generated from it.
    - name: Check the changelog
      run: node scripts/check-changelog.ts

    # Every shipped language is complete in every catalogue, with matching
    # placeholders and plural forms.
    - name: Check translations are complete
      run: node scripts/check-strings.ts

    - name: Test the scripts
      run: node --test scripts/*.test.ts

  # Development code (Cards/Development: Storybook, previews, sample data,
  # UI-test hooks) must never reach a release build.
  release-check:
    # The Xcode 27 image, so CI builds with the same Xcode as local builds (.xcode-version).
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Select the Xcode in .xcode-version
      run: |
        developer_dir="$(node scripts/select-xcode.ts)"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        "$developer_dir/usr/bin/xcodebuild" -version

    - name: Check release build has no development code
      run: node scripts/check-release-build.ts

  # The test runs, read from scripts/lib/test-devices.ts so the devices and
  # iOS versions are written down once.
  test-runs:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: List the test runs
      id: runs
      run: echo "runs=$(node scripts/print-test-runs.ts)" >> "$GITHUB_OUTPUT"

  tests:
    needs: test-runs
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-runs.outputs.runs) }}
    runs-on: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # The Xcode in .xcode-version, except where the run names another: iOS 18
    # runs with Xcode 26.6 on the macOS 26 image, as Xcode 27 cannot download it.
    - name: Select the Xcode for this run
      run: |
        developer_dir="$(node scripts/select-xcode.ts --run ${{ matrix.key }})"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        "$developer_dir/usr/bin/xcodebuild" -version

    # Downloads the run's iOS runtime from Apple where the image lacks it
    # (iOS 26.5 on the Xcode 27 image, iOS 18.6 on the macOS 26 one) while the
    # app and tests build, then runs the tests on their simulator.
    - name: Build and run the tests
      run: node scripts/run-tests.ts --run ${{ matrix.key }} --results "$RUNNER_TEMP/results"

    - name: Upload the result bundle
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.key }}.xcresult
        path: ${{ runner.temp }}/results/${{ matrix.key }}.xcresult
