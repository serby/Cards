name: CI

# Checks the app on every change to it (spec/deployment.md, DEPLOY-1): its
# code passes SwiftLint, its strings are translated, the changelog it shows in
# Settings > What's New is valid, and it builds and passes every test on each
# device and iOS it supports. The Xcode in .xcode-version builds the app and
# its tests once; a job for each test run in scripts/lib/test-devices.ts, the
# list `make test-all` uses, then runs them without building: the unit tests on
# the iPhone 17 on iOS 27.0, and the UI tests on the iPhone 17 and the iPad mini
# on iOS 26.5 and on the iPhone 16 on iOS 18.5. The iOS 18 job runs on the macOS
# 15 image, the only one with iOS 18, whose Xcode 26.3 runs the tests; the
# built tests bring Xcode 27.1's XCTest with them.
#
# Only changes to the app trigger it: its code, tests and project, the Xcode
# and SwiftLint versions and rules, and the changelog it bundles. The scripts
# have their own workflow (scripts.yml), and the release checks (development
# code, metadata, App Store images) run in release.yml.
on:
  push:
    paths:
      - 'Cards/**'
      - 'CardsWidget/**'
      - 'CardsTests/**'
      - 'CardsUITests/**'
      - 'Cards.xcodeproj/**'
      - '.xcode-version'
      - '.swiftlint.yml'
      - '.swiftlint-version'
      - 'changelog.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Cards/**'
      - 'CardsWidget/**'
      - 'CardsTests/**'
      - 'CardsUITests/**'
      - 'Cards.xcodeproj/**'
      - '.xcode-version'
      - '.swiftlint.yml'
      - '.swiftlint-version'
      - 'changelog.json'
      - '.github/workflows/ci.yml'

# A newer push makes an older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same SwiftLint version as local builds (.swiftlint-version), with the
  # rules in .swiftlint.yml. --strict fails on warnings too: the code is kept
  # with none (docs/DEVELOPMENT.md, rule 7). The image runs swiftlint itself,
  # so the command starts at the subcommand.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Lint with SwiftLint
      run: docker run --rm -v "$PWD:/work" -w /work "ghcr.io/realm/swiftlint:$(cat .swiftlint-version)" lint --strict

  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # Every shipped language is complete in every catalogue, with matching
    # placeholders and plural forms.
    - name: Check translations are complete
      run: node scripts/check-strings.ts

    # changelog.json, which the app shows in Settings > What's New, must be
    # valid, start with the app's version and match the files generated from it.
    - name: Check the changelog
      run: node scripts/check-changelog.ts

  # The test runs, read from scripts/lib/test-devices.ts so the devices and
  # iOS versions are written down once.
  test-runs:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: List the test runs
      id: runs
      run: echo "runs=$(node scripts/print-test-runs.ts)" >> "$GITHUB_OUTPUT"

  # Builds the app and its tests once, with the Xcode in .xcode-version, into
  # a folder that runs on any Mac: the products, their .xctestrun and that
  # Xcode's simulator test frameworks (scripts/lib/built-tests.ts). It is
  # packed in a tar, as artifacts lose file permissions.
  build:
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Select the Xcode in .xcode-version
      run: |
        developer_dir="$(node scripts/select-xcode.ts)"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        "$developer_dir/usr/bin/xcodebuild" -version

    - name: Build the app and its tests
      run: node scripts/build-tests.ts --out "$RUNNER_TEMP/built"

    - name: Pack the built tests
      run: tar -C "$RUNNER_TEMP/built" -cf "$RUNNER_TEMP/built-tests.tar" .

    - uses: actions/upload-artifact@v4
      with:
        name: built-tests
        path: ${{ runner.temp }}/built-tests.tar
        retention-days: 1

  tests:
    needs: [test-runs, build]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-runs.outputs.runs) }}
    runs-on: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - uses: actions/download-artifact@v4
      with:
        name: built-tests
        path: ${{ runner.temp }}

    - name: Unpack the built tests
      run: mkdir -p "$RUNNER_TEMP/built" && tar -C "$RUNNER_TEMP/built" -xf "$RUNNER_TEMP/built-tests.tar"

    # The Xcode that runs the tests: the one in .xcode-version, except where the
    # run names another, as the iOS 18 run names the macOS 15 image's 26.3. It
    # builds nothing.
    - name: Select the Xcode for this run
      run: |
        developer_dir="$(node scripts/select-xcode.ts --run ${{ matrix.key }})"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        "$developer_dir/usr/bin/xcodebuild" -version

    # Downloads the run's iOS runtime from Apple where the image lacks it
    # (iOS 26.5 on the Xcode 27 image; the macOS 15 image has iOS 18.5), then
    # runs the built tests on their simulator.
    - name: Run the tests
      run: node scripts/run-tests.ts --run ${{ matrix.key }} --built "$RUNNER_TEMP/built" --results "$RUNNER_TEMP/results"

    - name: Upload the result bundle
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.key }}.xcresult
        path: ${{ runner.temp }}/results/${{ matrix.key }}.xcresult
