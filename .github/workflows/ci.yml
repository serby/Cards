name: CI

# Kept fast: the build, the unit tests and quick checks, in parallel jobs.
# Screenshots are captured, composed and looked at locally before they are
# committed; CI only checks the App Store images are present.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'spec/**'
      - '.claude/**'
      - '.gitignore'
      - 'Website/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'spec/**'
      - '.claude/**'
      - '.gitignore'
      - 'Website/**'

# A newer push makes an older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Check the App Store images are present
      run: node scripts/check-store-images.ts

    # The App Store listing text in metadata/ must fit App Store Connect's limits.
    - name: Check App Store metadata
      run: node scripts/check-metadata.ts

    # changelog.json must be valid, start with the app's version, and match the
    # files generated from it.
    - name: Check the changelog
      run: node scripts/changelog.ts check

  # Development code (Cards/Development: Storybook, previews, sample data,
  # UI-test hooks) must never reach a release build.
  release-check:
    # The Xcode 27 image, so CI builds with the same Xcode as local builds (.xcode-version).
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v5

    - name: Select the Xcode in .xcode-version
      run: |
        source scripts/xcode-env.sh
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Check release build has no development code
      run: node scripts/check-release-clean.ts

  build-and-test:
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v5

    - name: Select the Xcode in .xcode-version
      run: |
        source scripts/xcode-env.sh
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

    # The simulator boots in the background while the app and tests build, since
    # each takes minutes on a fresh runner, then the unit tests run on it.
    - name: Build and run the unit tests
      run: |
        scripts/ci-resolve-sim.sh "iPhone 16 Pro Max" > /tmp/sim.env 2> /tmp/sim.log &
        sim=$!
        xcodebuild build-for-testing \
          -project Cards.xcodeproj \
          -scheme Cards \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build/dd \
          -enableCodeCoverage NO \
          ARCHS=arm64
        if ! wait "$sim"; then
          cat /tmp/sim.log
          exit 1
        fi
        cat /tmp/sim.log
        udid=$(sed -n 's/^udid=//p' /tmp/sim.env)
        xcodebuild test-without-building \
          -project Cards.xcodeproj \
          -scheme Cards \
          -destination "id=$udid" \
          -derivedDataPath build/dd \
          -only-testing:CardsTests \
          -resultBundlePath /tmp/CardsTests.xcresult \
          -testLanguage en \
          -testRegion US \
          -enableCodeCoverage NO \
          -collect-test-diagnostics never \
          -retry-tests-on-failure \
          -test-iterations 2

    - name: Upload test result bundle
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: CardsTests.xcresult
        path: /tmp/CardsTests.xcresult
