name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'Website/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'Website/**'

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v5

    - name: Install Bazelisk
      run: brew list bazelisk &>/dev/null || brew install bazelisk

    - name: Validate checked-in screenshots
      run: python3 scripts/validate-screenshots.py

    # Pre-create and boot the exact simulator used by xcodebuild. This avoids
    # CoreSimulator creation/boot races seen on macos-26 runners.
    - name: Resolve and warm simulator
      id: sim
      run: |
        scripts/ci-resolve-sim.sh "iPhone 16 Pro Max" >> "$GITHUB_OUTPUT"

    - name: Build
      run: bazel build //Cards:Cards

    # rules_apple's xctestrunner hangs with "Supported platforms ... is empty"
    # on macos-26 + iOS 26.5 sim. xcodebuild test directly against the
    # rules_xcodeproj output is the path that works locally and on CI.
    - name: Generate Xcode project
      run: |
        bazel run //:xcodeproj
        chmod -R u+w Cards.xcodeproj

    - name: Test
      run: |
        rm -rf /tmp/CardsTests.xcresult
        xcodebuild test \
          -project Cards.xcodeproj \
          -scheme Cards \
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }},OS=${{ steps.sim.outputs.version }}" \
          -only-testing:CardsTests \
          -only-testing:CardsUITests/CardsScreenshotTests \
          -resultBundlePath /tmp/CardsTests.xcresult \
          -testLanguage en \
          -testRegion US \
          -enableCodeCoverage NO \
          -collect-test-diagnostics never \
          -retry-tests-on-failure \
          -test-iterations 2

    - name: Validate iPhone screenshot captures
      run: |
        rm -rf /tmp/CardsPhoneAttachments
        xcrun xcresulttool export attachments \
          --path /tmp/CardsTests.xcresult \
          --output-path /tmp/CardsPhoneAttachments
        python3 scripts/validate-screenshots.py \
          --attachments /tmp/CardsPhoneAttachments \
          --capture-set iphone

    - name: Resolve and warm iPad simulator
      id: ipad
      run: |
        scripts/ci-resolve-sim.sh "iPad Pro 13-inch (M4)" >> "$GITHUB_OUTPUT"

    - name: Test iPad screenshot capture
      run: |
        rm -rf /tmp/CardsIPadTests.xcresult
        xcodebuild test \
          -project Cards.xcodeproj \
          -scheme Cards \
          -destination "platform=iOS Simulator,name=${{ steps.ipad.outputs.device }},OS=${{ steps.ipad.outputs.version }}" \
          -only-testing:CardsUITests/CardsScreenshotTests/testCaptureScreenshots \
          -testLanguage en \
          -testRegion US \
          -enableCodeCoverage NO \
          -collect-test-diagnostics never \
          -resultBundlePath /tmp/CardsIPadTests.xcresult

    - name: Validate iPad screenshot capture
      run: |
        rm -rf /tmp/CardsIPadAttachments
        xcrun xcresulttool export attachments \
          --path /tmp/CardsIPadTests.xcresult \
          --output-path /tmp/CardsIPadAttachments
        python3 scripts/validate-screenshots.py \
          --attachments /tmp/CardsIPadAttachments \
          --capture-set ipad

    - name: Upload test result bundle
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: CardsTests.xcresult
        path: |
          /tmp/CardsTests.xcresult
          /tmp/CardsIPadTests.xcresult
