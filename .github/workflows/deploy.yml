name: Deploy to TestFlight

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Tag pushes trigger release.yml (App Store) instead — we don't want both
  # workflows uploading at once because App Store Connect rejects concurrent
  # uploads with ENTITY_ERROR.RELATIONSHIP.INVALID.INVALID_STATE.

jobs:
  deploy:
    runs-on: macos-26
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    steps:
    - uses: actions/checkout@v5

    - name: Bump CFBundleVersion
      run: |
        BUILD=$(( ( $(date -u +%s) - 1767225600 ) / 60 ))
        echo "Setting CFBundleVersion to $BUILD"
        echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

    - name: Install signing
      uses: ./.github/actions/install-signing
      with:
        certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.P12_PASSWORD }}
        keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
        asc-key-id: ${{ secrets.ASC_KEY_ID }}
        asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
        asc-key-content: ${{ secrets.ASC_KEY_CONTENT }}

    - name: Deploy to TestFlight
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: scripts/deploy-testflight.sh

    - name: Clean up keychain
      if: ${{ always() }}
      run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
