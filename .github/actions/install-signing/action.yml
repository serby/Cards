name: Install signing
description: >
  Imports the Apple Distribution certificate into a temporary keychain and
  installs App Store profiles for the app and its widget, creating or renewing
  them through the App Store Connect API (scripts/install-signing-certificate.ts,
  which runs scripts/install-signing-profiles.ts). Delete the keychain afterwards
  with `node scripts/install-signing-certificate.ts --remove`.

inputs:
  certificate-base64:
    description: The .p12 certificate, base64-encoded
    required: true
  p12-password:
    description: The .p12 password
    required: true
  keychain-password:
    description: A password for the temporary keychain
    required: true
  asc-key-id:
    required: true
  asc-issuer-id:
    required: true
  asc-key-content:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install the certificate and profiles
      shell: bash
      env:
        BUILD_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        P12_PASSWORD: ${{ inputs.p12-password }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain-password }}
        ASC_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_ISSUER_ID: ${{ inputs.asc-issuer-id }}
        ASC_KEY_CONTENT: ${{ inputs.asc-key-content }}
      run: node scripts/install-signing-certificate.ts net.serby.Cards net.serby.Cards.Widget
