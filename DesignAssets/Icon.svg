<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cards app icon: two loyalty cards, a barcode card behind a QR code card.
  Master artwork for the light appearance. scripts/generate-app-icons.ts derives the
  dark and tinted variants by swapping the two colours below, then renders the PNGs.
    background  #FFFFFF  (also used for the codes and the gap around the front card)
    glyph       #0A0A0A
  Geometry: 1024 grid. Each card is 560 x 352 (radius 46) drawn about its own centre,
  barcode unit 18, QR module 32. The front card's halo is the card grown by 24.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect id="background" width="1024" height="1024" fill="#FFFFFF"/>

  <g id="back-card" transform="translate(457 400) rotate(-4)">
