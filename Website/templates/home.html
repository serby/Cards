    <section class="hero">
      <img src="/icon.png" alt="" width="96" height="96" class="app-icon">
      <h1>{{appName}}</h1>
      <p class="subtitle">{{subtitle}}</p>
      <p class="lead">{{lead}}</p>
      <p class="promise">{{promise}}</p>
      <a href="{{appStore}}" class="cta">{{download}}</a>
    </section>
{{{screenshots}}}
    <section id="features" class="features" aria-labelledby="features-title">
      <h2 id="features-title">{{featuresTitle}}</h2>
      <div class="feature-grid">
{{{features}}}
      </div>
    </section>

    <section id="languages" class="languages" aria-labelledby="languages-title">
      <h2 id="languages-title">{{languagesTitle}}</h2>
      <p>{{languagesIntro}}</p>
      <ul class="language-list">
{{{languages}}}
      </ul>
    </section>

    <section id="whats-new" class="whats-new" aria-labelledby="whats-new-title">
      <h2 id="whats-new-title">{{whatsNew}}</h2>
{{{versions}}}
    </section>

    <section id="download" class="download" aria-labelledby="download-title">
      <h2 id="download-title">{{getApp}}</h2>
      <p>{{requirements}}</p>
      <a href="{{appStore}}" class="cta">{{download}}</a>
    </section>
